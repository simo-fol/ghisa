name: iOS build

# Builds an unsigned .ipa on a free macOS runner. SideStore/AltStore sign it
# with your free Apple ID when you install it on the iPhone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'

      # Xcode and the iOS workload below must match: bump both together.
      - name: Select Xcode 26.5
        run: |
          ls -la /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_26.5*.app | grep -vi beta | sort -V | head -1)
          # Names like Xcode_26.5.0.app are symlinks; actool cannot find the SDKs through them.
          XCODE=$(cd "$XCODE" && pwd -P)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk macosx --show-sdk-path

      # The latest iOS workload needs a newer Xcode than the runner has.
      - name: Install iOS workload
        run: |
          dotnet workload config --update-mode manifests
          echo '{"microsoft.net.sdk.ios": "26.5.10301/10.0.100"}' > rollback.json
          dotnet workload install ios --from-rollback-file rollback.json
          dotnet workload list

      - name: Build
        run: >
          dotnet build WorkoutLog.iOS/WorkoutLog.iOS.csproj
          -c Release -r ios-arm64
          -p:EnableCodeSigning=false
          -p:ValidateXcodeVersion=false
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          APP=$(find WorkoutLog.iOS/bin/Release -type d -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Allenamento.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Allenamento-ipa
          path: Allenamento.ipa

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ultima build
          body: Build ${{ github.run_number }} da ${{ github.sha }}. Scarica Allenamento.ipa e aprilo con SideStore/AltStore.
          files: Allenamento.ipa
          make_latest: true
